# Local / VPS deployment. Build and run with:
#
#     docker compose up --build
#     # → open http://localhost:7860
#
# The first request on the real model downloads ~388 MB of weights from Kaggle
# into the named volume below, so subsequent restarts start instantly.
services:
  perch:
    build: .
    image: perch-2.0
    ports:
      - "7860:7860"
    environment:
      # Real Perch 2.0 on CPU. Uncomment PERCH_MOCK to run the weight-free demo.
      PERCH_MODEL_NAME: perch_v2_cpu
      # PERCH_MOCK: "1"
      # PERCH_TOP_K: "5"
      # PERCH_THRESHOLD: "0.1"
      # PERCH_MAX_UPLOAD_MB: "50"
    volumes:
      # Persist the Kaggle weights cache across container restarts.
      - perch-model-cache:/home/app/.cache/kagglehub
    restart: unless-stopped

volumes:
  perch-model-cache:
